<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9e8e1" />
    <meta
      name="description"
      content="PARALLAX — a first-person spatial puzzle experiment. Place two portals. Rethink the distance between them."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PARALLAX — A spatial reasoning experiment</title>
    <style>
      [data-kata-arcade-nav] a:focus-visible {
        outline: 3px solid #ffdf70 !important;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div
      role="navigation"
      aria-label="Arcade navigation"
      data-kata-arcade-nav
      style="
        all: initial;
        display: block;
        position: fixed;
        left: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        z-index: 2147483647;
        font:
          600 13px/1.3 system-ui,
          sans-serif;
      "
    >
      <a
        href="https://intrepion.github.io/"
        style="
          display: inline-block;
          margin: 8px;
          padding: 8px 12px;
          border: 2px solid #fff;
          border-radius: 6px;
          background: #17262a;
          color: #fff;
          text-decoration: underline;
          text-underline-offset: 3px;
          box-shadow: 0 1px 4px #0008;
        "
        >← Kata Arcade</a
      >
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
